AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation template for City Listing Project (Fargate, RDS, CloudMap, CloudWatch)

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where the resources will be deployed
  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First private subnet ID for ECS (must have NAT Gateway for internet access to pull ECR images) and RDS
  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second private subnet ID for ECS and RDS
  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First public subnet ID for Application Load Balancer
  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second public subnet ID for Application Load Balancer
  DatabaseUsername:
    Type: String
    Default: admin
    Description: Username for the SQL Server RDS database
  DatabasePassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Password for the SQL Server RDS database
  CityApiImageUri:
    Type: String
    Description: ECR Image URI for the CityApi container
  CityWebImageUri:
    Type: String
    Description: ECR Image URI for the CityWeb container
  EnvironmentName:
    Type: String
    Default: CityProject
    Description: Environment name used as a prefix for resources
  AssignPublicIp:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Whether to assign a public IP to the Fargate tasks. Use ENABLED if using a default VPC or subnets without NAT Gateway.

Resources:
  # ----------------------------------------------------------------------
  # CloudWatch Log Groups
  # ----------------------------------------------------------------------
  CityApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}-api
      RetentionInDays: 7

  CityWebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}-web
      RetentionInDays: 7

  # ----------------------------------------------------------------------
  # Security Groups
  # ----------------------------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic from the internet to the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from ALB to CityWeb Fargate tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from CityWeb to CityApi Fargate tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref WebSecurityGroup

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from CityApi to RDS SQL Server
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          SourceSecurityGroupId: !Ref ApiSecurityGroup

  # ----------------------------------------------------------------------
  # RDS Database (SQL Server Express)
  # ----------------------------------------------------------------------
  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets available for the RDS Database Instance
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  CityDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: sqlserver-ex
      DBInstanceClass: db.t3.small
      AllocatedStorage: 20
      MasterUsername: !Ref DatabaseUsername
      MasterUserPassword: !Ref DatabasePassword
      DBSubnetGroupName: !Ref RdsSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      StorageType: gp2

  # ----------------------------------------------------------------------
  # Cloud Map (Service Discovery)
  # ----------------------------------------------------------------------
  CloudMapNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: cityproject.local
      Vpc: !Ref VpcId

  ApiDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: api
      DnsConfig:
        NamespaceId: !GetAtt CloudMapNamespace.Id
        DnsRecords:
          - Type: A
            TTL: 60
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # ----------------------------------------------------------------------
  # Application Load Balancer (for Web)
  # ----------------------------------------------------------------------
  PublicLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${EnvironmentName}-ALB
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${EnvironmentName}-WebTG
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PublicLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  # ----------------------------------------------------------------------
  # ECS Cluster
  # ----------------------------------------------------------------------
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${EnvironmentName}Cluster

  # IAM Roles
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # ----------------------------------------------------------------------
  # ECS Task Definitions
  # ----------------------------------------------------------------------
  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-ApiTask
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: city-api
          Image: !Ref CityApiImageUri
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - Name: ConnectionStrings__DefaultConnection
              Value: !Sub "Server=${CityDatabase.Endpoint.Address},${CityDatabase.Endpoint.Port};Database=CityDb;User Id=${DatabaseUsername};Password=${DatabasePassword};TrustServerCertificate=True"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CityApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-WebTask
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: city-web
          Image: !Ref CityWebImageUri
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - Name: ApiSettings__CityApiBaseUrl
              Value: "http://api.cityproject.local:8080"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CityWebLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ----------------------------------------------------------------------
  # ECS Services
  # ----------------------------------------------------------------------
  ApiService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub ${EnvironmentName}-ApiService
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref ApiTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          SecurityGroups:
            - !Ref ApiSecurityGroup
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
      ServiceRegistries:
        - RegistryArn: !GetAtt ApiDiscoveryService.Arn

  WebService:
    Type: AWS::ECS::Service
    DependsOn: AlbListener
    Properties:
      ServiceName: !Sub ${EnvironmentName}-WebService
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref WebTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          SecurityGroups:
            - !Ref WebSecurityGroup
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
      LoadBalancers:
        - ContainerName: city-web
          ContainerPort: 8080
          TargetGroupArn: !Ref WebTargetGroup

Outputs:
  WebsiteUrl:
    Description: The URL of the City Listing Website
    Value: !Sub "http://${PublicLoadBalancer.DNSName}"
